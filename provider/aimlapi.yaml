provider: aimlapi
label:
  en_US: aimlapi.com
description:
  en_US: "Access 1,000+ AI models: text, image, video, audio and embeddings - through a single API key. One-click setup"
icon_small:
  en_US: icon.svg
icon_large:
  en_US: icon.svg
background: "#111827"
help:
  title:
    en_US: Get your API key from aimlapi.com
  url:
    en_US: https://staging.aimlapi.com/app/keys?dify_device_authorization=api_key&dify_authorization_name=aimlapi.com%20API%20key
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your aimlapi.com key
model_credential_schema:
  model:
    label:
      en_US: Model Name
    placeholder:
      en_US: Enter full aimlapi.com model ID
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your aimlapi.com key
    - variable: mode
      show_on:
        - variable: __model_type
          value: llm
      label:
        en_US: Completion mode
      type: select
      required: false
      default: chat
      placeholder:
        en_US: Select completion mode
      options:
        - value: completion
          label:
            en_US: Completion
        - value: chat
          label:
            en_US: Chat
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
extra:
  python:
    provider_source: provider/aimlapi.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
