model: "x-ai/grok-4-6"
label:
  en_US: "Grok 4.6"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - document
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
pricing:
  input: "2.6"
  output: "7.8"
  unit: "0.000001"
  currency: USD
