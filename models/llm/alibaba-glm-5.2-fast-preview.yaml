model: "alibaba/glm-5.2-fast-preview"
label:
  en_US: "GLM 5.2 Fast Preview (Alibaba)"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 131072
  - name: response_format
    use_template: response_format
pricing:
  input: "4.55"
  output: "14.3"
  unit: "0.000001"
  currency: USD
