model: "alibaba/qwen3.8-27b"
label:
  en_US: "Qwen3.8 27B"
model_type: llm
features:
  - vision
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
