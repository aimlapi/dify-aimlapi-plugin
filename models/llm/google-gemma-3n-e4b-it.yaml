model: "google/gemma-3n-e4b-it"
label:
  en_US: "Gemma 3n 4B"
model_type: llm
features:
  - document
model_properties:
  mode: chat
  context_size: 8192
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 2048
    min: 1
    max: 2048
pricing:
  input: "0.026"
  output: "0.052"
  unit: "0.000001"
  currency: USD
