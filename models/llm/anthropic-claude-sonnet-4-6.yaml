model: "anthropic/claude-sonnet-4-6"
label:
  en_US: "Claude 4.6 Sonnet"
model_type: llm
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 64000
pricing:
  input: "3.9"
  output: "19.5"
  unit: "0.000001"
  currency: USD
