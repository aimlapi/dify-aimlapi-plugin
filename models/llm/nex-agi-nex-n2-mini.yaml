model: "nex-agi/nex-n2-mini"
label:
  en_US: "Nex-N2-Mini"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 262144
  - name: response_format
    use_template: response_format
pricing:
  input: "0.0325"
  output: "0.13"
  unit: "0.000001"
  currency: USD
