model: "deepseek/deepseek-reasoner"
label:
  en_US: "DeepSeek R1"
model_type: llm
features:
  - document
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 127000
pricing:
  input: "0.364"
  output: "0.546"
  unit: "0.000001"
  currency: USD
