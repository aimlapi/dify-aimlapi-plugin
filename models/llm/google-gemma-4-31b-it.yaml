model: "google/gemma-4-31b-it"
label:
  en_US: "Gemma 4 31B Instruct"
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 262144
  - name: response_format
    use_template: response_format
pricing:
  input: "1.287"
  output: "1.937"
  unit: "0.000001"
  currency: USD
