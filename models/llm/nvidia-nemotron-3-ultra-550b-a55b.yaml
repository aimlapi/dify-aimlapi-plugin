model: "nvidia/nemotron-3-ultra-550b-a55b"
label:
  en_US: "Nemotron 3 Ultra 550B A55B"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - document
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 32768
  - name: response_format
    use_template: response_format
pricing:
  input: "0.65"
  output: "3.25"
  unit: "0.000001"
  currency: USD
