model: "morph/morph-v3-fast"
label:
  en_US: "V3 Fast"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 81920
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 38000
  - name: response_format
    use_template: response_format
pricing:
  input: "1.04"
  output: "1.56"
  unit: "0.000001"
  currency: USD
