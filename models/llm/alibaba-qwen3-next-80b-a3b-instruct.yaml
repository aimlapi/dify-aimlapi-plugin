model: "alibaba/qwen3-next-80b-a3b-instruct"
label:
  en_US: "Qwen3 Next 80B A3B Instruct"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 129024
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
  - name: response_format
    use_template: response_format
pricing:
  input: "0.195"
  output: "1.56"
  unit: "0.000001"
  currency: USD
