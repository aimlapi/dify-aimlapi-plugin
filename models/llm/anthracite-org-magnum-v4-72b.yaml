model: "anthracite-org/magnum-v4-72b"
label:
  en_US: "Magnum v4 72B"
model_type: llm
features:
  - document
model_properties:
  mode: chat
  context_size: 32000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
  - name: response_format
    use_template: response_format
pricing:
  input: "3.9"
  output: "6.5"
  unit: "0.000001"
  currency: USD
