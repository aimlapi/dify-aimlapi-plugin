model: "deepseek/deepseek-reasoner-v3.1-terminus"
label:
  en_US: "DeepSeek V3.1 Terminus (Reasoner)"
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - document
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 8000
  - name: response_format
    use_template: response_format
pricing:
  input: "0.351"
  output: "1.235"
  unit: "0.000001"
  currency: USD
