model: "alibaba/qwen3.6-27b"
label:
  en_US: "Qwen3.6 27B"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 252000
  - name: response_format
    use_template: response_format
pricing:
  input: "0.78"
  output: "4.68"
  unit: "0.000001"
  currency: USD
