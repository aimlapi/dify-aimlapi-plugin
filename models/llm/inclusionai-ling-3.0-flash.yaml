model: "inclusionai/ling-3.0-flash"
label:
  en_US: "Ling-3.0-flash"
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 32768
pricing:
  input: "0.0975"
  output: "0.286"
  unit: "0.000001"
  currency: USD
