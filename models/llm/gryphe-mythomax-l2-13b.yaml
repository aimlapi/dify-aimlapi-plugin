model: "gryphe/mythomax-l2-13b"
label:
  en_US: "MythoMax 13B"
model_type: llm
features:
  - document
model_properties:
  mode: chat
  context_size: 4096
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 4096
pricing:
  input: "2.4375"
  output: "2.4375"
  unit: "0.000001"
  currency: USD
