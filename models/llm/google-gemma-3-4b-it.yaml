model: "google/gemma-3-4b-it"
label:
  en_US: "Gemma 3 4B"
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 131000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 32768
pricing:
  input: "0.065"
  output: "0.13"
  unit: "0.000001"
  currency: USD
