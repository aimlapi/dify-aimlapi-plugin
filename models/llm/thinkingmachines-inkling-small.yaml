model: "thinkingmachines/inkling-small"
label:
  en_US: "Inkling Small"
model_type: llm
features:
  - vision
  - document
model_properties:
  mode: chat
  context_size: 524288
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 262144
pricing:
  input: "0.754"
  output: "1.872"
  unit: "0.000001"
  currency: USD
