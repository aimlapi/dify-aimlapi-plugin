model: "sakana/sakana-namazu"
label:
  en_US: "Sakana Namazu"
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 65536
  - name: response_format
    use_template: response_format
pricing:
  input: "1.235"
  output: "5.2"
  unit: "0.000001"
  currency: USD
