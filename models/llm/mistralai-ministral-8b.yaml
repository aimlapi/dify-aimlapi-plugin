model: "mistralai/ministral-8b"
label:
  en_US: "Ministral 8B"
model_type: llm
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 16384
  - name: response_format
    use_template: response_format
pricing:
  input: "0.143"
  output: "0.143"
  unit: "0.000001"
  currency: USD
