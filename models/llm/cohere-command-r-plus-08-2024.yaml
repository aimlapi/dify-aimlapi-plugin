model: "cohere/command-r-plus-08-2024"
label:
  en_US: "Command R+ (08-2024)"
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - document
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4000
    min: 1
    max: 4000
  - name: response_format
    use_template: response_format
pricing:
  input: "3.25"
  output: "13"
  unit: "0.000001"
  currency: USD
